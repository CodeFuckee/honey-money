# honey-money 本地/群晖 NAS 一键编排
# 用法：cp .env.example .env （按需改端口/连接串）→ docker compose up -d
# 群晖：Container Manager → 项目 → 指向本仓库目录，同样走 .env + up
#
# 拓扑（只有 frontend 对外，其余全部内网互通）：
#   [外部 :28080] → frontend(nginx) ─┬─ 静态托管 Vue
#                                  └─ /api 反代 → backend:8000
#   backend ──→ NAS 宿主上的既有 PostgreSQL（host.docker.internal:5433，库 honey_money）
#          ──→ proxy_pool:5010（检活）；proxy_pool → redis:6379
# 注意：PostgreSQL 由 NAS 上已有容器提供（本编排不再创建），需确保：
#   ① 该 PG 在宿主映射了 5433 端口；② 已建库 honey_money 与用户 honey_money。

services:
  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-28080}:80"  # 对外唯一端口（DSM 占 5000/5001，8080 常被群晖其他应用占用）
    depends_on:
      - backend

  backend:
    build: ./backend
    restart: unless-stopped
    # Linux 容器访问宿主服务：host-gateway 由 Docker 注入宿主网关 IP（需 Docker 20.10+）
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://honey_money:honey_money@host.docker.internal:5433/honey_money}
      PROXY_POOL_URL: http://proxy_pool:5010

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

  proxy_pool:
    image: jhao104/proxy_pool:latest   # x86_64；ARM 机型需自行构建该镜像（见 README）
    # 官方镜像 bug：基础镜像 alpine 无 bash 而 ENTRYPOINT 执行 bash（exit 127 崩溃循环）。
    # 覆盖入口改用 alpine 自带的 sh；若脚本将来出现 bashism 再改为自建镜像。
    entrypoint: ["tini", "--", "sh", "proxy_pool.sh", "start", "--fg"]
    restart: unless-stopped
    environment:
      DB_CONN: redis://redis:6379/0
    depends_on:
      - redis

volumes:
  redis_data:
