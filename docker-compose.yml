# honey-money 本地/群晖 NAS 一键编排
# 用法：cp .env.example .env （按需改端口/连接串）→ docker compose up -d
# 群晖：Container Manager → 项目 → 指向本仓库目录，同样走 .env + up
#
# 拓扑（三容器；frontend 对外、mcp 供 agent 远程接入，公共设施走宿主）：
#   [外部 :28080] → frontend(nginx) ─┬─ 静态托管 Vue
#                                  └─ /api 反代 → backend:8000
#   [内网 :28081] → mcp（streamable HTTP，agent 经 http://<NAS>:28081/mcp 直连）
#   backend ──→ NAS 宿主上的既有 PostgreSQL（host.docker.internal:5433，库 honey_money）
#          ──→ NAS 上的公共代理池（host.docker.internal:5010，独立部署的
#               proxy-pool:2.4.1-aclfix + 专用 redis 8，多项目共用）
# 注意：PostgreSQL 与代理池均不由本编排创建，需确保：
#   ① 宿主 5433 有 PG（库/用户 honey_money）；② 宿主 5010 有公共代理池在跑。
# mcp 无鉴权，仅限内网使用（与 backend 同安全级别）；不对公网映射端口。

services:
  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-28080}:80"  # 对外唯一端口（DSM 占 5000/5001，8080 常被群晖其他应用占用）
    depends_on:
      - backend

  backend:
    build: ./backend
    restart: unless-stopped
    # Linux 容器访问宿主服务：host-gateway 由 Docker 注入宿主网关 IP（需 Docker 20.10+）
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # 东财 Cookie 持久化：容器重建/升级不丢（em_cookie.py 默认路径 /srv/data/em_cookie.txt）
      - em_cookie:/srv/data
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://honey_money:honey_money@host.docker.internal:5433/honey_money}
      # 公共代理池：NAS 上独立部署（宿主 5010），多项目共用；换私有池时在此覆盖
      PROXY_POOL_URL: ${PROXY_POOL_URL:-http://host.docker.internal:5010}

  mcp:
    build: ./backend            # 与 backend 同镜像，仅启动命令不同
    restart: unless-stopped
    command: python -m app.mcp_server --http --host 0.0.0.0 --port 8081
    environment:
      HONEY_MONEY_BACKEND_URL: http://backend:8000
    ports:
      - "${MCP_PORT:-28081}:8081"
    depends_on:
      - backend

volumes:
  em_cookie:
