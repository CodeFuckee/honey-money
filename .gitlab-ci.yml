# main 流水线：test 全绿 → 自动部署到群晖 NAS（runner #18 "nas"）
#
# 部署原理：#18 runner 运行在群晖 Docker 里且映射了宿主 docker，
# 作业内执行 docker compose 实际作用对象是 NAS 的 Docker daemon，
# 容器因此直接落在 NAS 上并持久存在（作业结束后不会被清理）。

# —— 基础镜像预取（防外网容器 registry 阻断）——
# 2026-10-06 流水线 3370 根因：本网络直连 Docker Hub 与公共镜像加速全部挂起
# （本机实测 60~120s 零字节），NAS 此前构建全靠镜像缓存，缓存被 NAS 清理任务
# 清掉后 docker build/compose 拉基础镜像无限卡死（job 挂 30min 被手动取消）。
# 解法：构建/部署前经国内镜像源轮换拉取基础镜像并 retag 成规范名，
# Dockerfile/compose 保持官方镜像名不动（可移植）。缓存命中时秒过零开销。
# 注：pypi.org / registry.npmjs.org 直连正常，无需换源；镜像源可用性会漂移，
# 失败时按此清单顺序换源即可（2026-10 实测 1panel.live 可用但慢，单镜像 3~8 分钟）。
.mirror-fetch: &mirror-fetch |
  set -e
  fetch_base() {
    canonical="$1"; shift
    if docker image inspect "$canonical" >/dev/null 2>&1; then echo "缓存命中: $canonical"; return 0; fi
    PULL="docker pull"; command -v timeout >/dev/null 2>&1 && PULL="timeout 25m docker pull"
    for m in "$@"; do
      src="$m/$canonical"
      case "$canonical" in */*) ;; *) src="$m/library/$canonical";; esac
      echo "拉取 $src ..."
      if $PULL "$src"; then docker tag "$src" "$canonical"; return 0; fi
      echo "镜像源不可用，换下一个: $m"
    done
    echo "错误：所有镜像源均拉不到 $canonical"; exit 1
  }

stages:
  - test
  - deploy

backend-test:
  stage: test
  # 钉死到 NAS runner（唯一确定有 docker 的 runner）：runner 池异构
  # （Linux shell / Windows pwsh / NAS），无标签作业随机认领导致环境不可复现。
  tags: [linux, docker, nas, deploy]
  timeout: 90m
  script:
    - *mirror-fetch
    - fetch_base python:3.12-slim docker.1panel.live docker.1ms.run docker.m.daocloud.io
    - docker build -q -t honey-money-backend-test -f backend/Dockerfile.test backend
    - docker run --rm honey-money-backend-test

deploy-nas:
  stage: deploy
  image: docker:27-cli          # shell 执行器下会被忽略，无害
  tags: [linux, docker, nas, deploy]
  timeout: 90m
  variables:
    COMPOSE_PROJECT_NAME: honey-money   # 固定项目名：job 目录每次随机，不固定会残留孤儿项目
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  before_script:
    - |
      docker info > /dev/null 2>&1 || {
        echo "runner 容器访问不到 docker daemon（socket 映射未生效）"; exit 1; }
  script:
    # 预取构建基础镜像 + 编排现成镜像（防外网 registry 阻断，见文件头说明；
    # 运行中容器引用的镜像不会被 NAS 清理任务删，此项多为缓存命中秒过）
    - *mirror-fetch
    - fetch_base python:3.12-slim docker.1panel.live docker.1ms.run docker.m.daocloud.io
    - fetch_base node:22-alpine docker.1panel.live docker.1ms.run docker.m.daocloud.io
    - fetch_base nginx:1.27-alpine docker.1panel.live docker.1ms.run docker.m.daocloud.io
    # 兼容 compose v2 插件与旧版 docker-compose
    - |
      if docker compose version > /dev/null 2>&1; then DC="docker compose";
      elif command -v docker-compose > /dev/null 2>&1; then DC="docker-compose";
      else echo "runner 内无 docker compose 可用"; exit 1; fi
    - echo "使用 $DC 部署到 NAS ..."
    # --remove-orphans：清除已从编排移除但仍在运行的旧服务容器（如内置 postgres）
    - $DC -p honey-money up -d --build --remove-orphans
    - $DC -p honey-money ps
    # 注：不做 docker image prune——群晖 daemon 上实测会挂起不返回（流水线 3080 卡 30min），
    # 镜像清理留给 NAS 定期任务（Container Manager 或计划任务手动清理）
  environment:
    name: nas

# 手动运维工具：在 NAS 上抓 honey-money 全部容器状态与日志（CI 页面手动触发）
nas-diag:
  stage: deploy
  image: docker:27-cli
  tags: [linux, docker, nas, deploy]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
  allow_failure: true
  script:
    - docker ps -a --filter name=honey-money --format 'table {{.Names}}\t{{.Status}}\t{{.Image}}'
    # 完整 ID + 重启策略 + compose 项目标签：核对 Container Manager 界面显示是否与真实状态一致
    - |
      echo "===================== 真实状态核对（名称/短ID/重启策略/项目标签） ====================="
      for c in $(docker ps -a --filter name=honey-money --format '{{.Names}}' | sort); do
        docker inspect -f '{{.Name}}  short_id={{.Id}}  restart={{.HostConfig.RestartPolicy.Name}}  project={{index .Config.Labels "com.docker.compose.project"}}' "$c"
      done
    - |
      for c in $(docker ps -a --filter name=honey-money --format '{{.Names}}'); do
        echo "===================== $c ====================="
        docker logs --tail 40 "$c" 2>&1
      done
    - |
      echo "===================== 端到端：backend → 公共代理池 /get（宿主 5010） ====================="
      docker exec honey-money-backend-1 python -c "import httpx; r=httpx.get('http://host.docker.internal:5010/get/', timeout=5); print('HTTP', r.status_code, r.text[:200])" 2>&1 || true
    - |
      echo "===================== 端到端：backend → PostgreSQL（/api/infra） ====================="
      docker exec honey-money-backend-1 python -c "import httpx; print(httpx.get('http://127.0.0.1:8000/api/infra', timeout=8).text)" 2>&1 || true

nas-ops:
  stage: deploy
  tags: [linux, docker, nas, deploy]
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^ops\//'
      exists: [ops-cmd.txt]
      when: manual
  allow_failure: true
  timeout: 10m
  script:
    - CMD="$(cat ops-cmd.txt)"
    - |
      case "$CMD" in
        docker\ *) sh -c "$CMD" ;;
        *) echo "拒绝：仅允许 docker 命令"; exit 1 ;;
      esac
