# GitHub Pages：定投止盈回测静态快照站。
# 数据来自 site-data/（scripts/export_static_api.py 在有库环境导出后提交），
# 前端以 VITE_STATIC=1 构建为纯静态应用（无后端，明细不含净值曲线）。
name: pages
on:
  push:
    branches: [main]
    paths: ['frontend/**', 'site-data/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: build（静态快照模式，Pages 项目子路径）
        working-directory: frontend
        env:
          VITE_STATIC: '1'
          VITE_BASE: /honey-money/
        run: |
          npm ci
          npm run build
      - name: 注入快照数据
        run: |
          mkdir -p frontend/dist/data
          cp -r site-data/* frontend/dist/data/
      - name: upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist
      - id: deployment
        uses: actions/deploy-pages@v4
