server {
    listen 80;

    # Vue 静态产物（Vite 构建出的是单页应用，路由回退到 index.html）
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # API 反代到后端容器（compose 网络内的服务名）
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 回测接口首次调用触发 numba JIT 编译（部署后第一次可达数十秒），
        # 默认 60s 会掐断成 504 HTML 页——放宽到 5 分钟；配合启动预热兜底
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
    location = /healthz {
        proxy_pass http://backend:8000;
    }
}
