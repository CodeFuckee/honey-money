server {
    listen 80;

    # backend 服务名运行时解析（Docker 内嵌 DNS 127.0.0.11，10s 缓存）：
    # 静态 proxy_pass 在 nginx 启动时一次性解析并永久缓存——2026-11-25 实测
    # 任务独立 worker 后 backend 可被补部署单独重建（换 IP），frontend 不
    # 同批重建时 nginx 仍指旧 IP → /api 全量 502 直到下次全量部署。改为
    # 变量 + resolver 后每次请求（≤10s 缓存）重新查 Docker DNS，重建后
    # 自动跟上，无需重建 frontend。
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:8000;

    # Vue 静态产物（Vite 构建出的是单页应用，路由回退到 index.html）
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # API 反代到后端容器（compose 网络内的服务名）
    location /api/ {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 回测接口首次调用触发 numba JIT 编译（部署后第一次可达数十秒），
        # 默认 60s 会掐断成 504 HTML 页——放宽到 5 分钟；配合启动预热兜底
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
    location = /healthz {
        proxy_pass $backend_upstream;
    }
}
